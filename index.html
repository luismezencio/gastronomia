<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Cardápio + Comandas | Impressão USB direta (sem fallback)</title>
    <style>
        * { box-sizing: border-box; font-family: system-ui, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f5f5f5; margin: 0; padding: 12px; padding-bottom: 100px; }
        .comandas-header { background: white; border-radius: 20px; padding: 12px; margin-bottom: 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        .mesa-select { flex: 1; padding: 8px; border-radius: 40px; border: 1px solid #ccc; }
        .btn-nova-mesa { background: #27ae60; color: white; border: none; padding: 8px 16px; border-radius: 40px; }
        .badge-mesa { background: #ecf0f1; border-radius: 30px; padding: 6px 12px; display: inline-flex; align-items: center; gap: 6px; }
        .badge-mesa.ativa { background: #3498db; color: white; }
        .produtos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-bottom: 25px; }
        .card-produto { background: white; border-radius: 20px; padding: 12px; text-align: center; }
        .preco { font-weight: bold; color: #e67e22; font-size: 1.2rem; margin: 6px 0; }
        .qtd-controle { display: flex; justify-content: center; gap: 12px; margin: 8px 0; }
        .qtd-controle button { background: #3498db; border: none; color: white; width: 32px; height: 32px; border-radius: 30px; }
        .add-btn { background: #27ae60; color: white; border: none; padding: 8px; border-radius: 40px; width: 100%; font-weight: bold; }
        .carrinho { background: white; border-radius: 28px; padding: 16px; margin-top: 20px; }
        .item-carrinho { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0; flex-wrap: wrap; gap: 6px; }
        .btn-imprimir-item { background: #f39c12; border: none; color: white; padding: 6px 12px; border-radius: 30px; }
        .btn-remover-item { background: #e74c3c; border: none; color: white; padding: 6px 12px; border-radius: 30px; }
        .total { font-size: 1.4rem; font-weight: bold; text-align: right; border-top: 2px dashed #ccc; padding-top: 12px; }
        .acoes-carrinho { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
        button { background: #2c3e50; border: none; padding: 10px 16px; border-radius: 40px; color: white; font-weight: bold; cursor: pointer; }
        .btn-imprimir-completo { background: #e67e22; flex: 1; }
        .btn-testar { background: #16a085; }
        .admin-panel { background: #ecf0f1; border-radius: 28px; padding: 16px; margin-top: 25px; }
        .form-produto { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
        .form-produto input { flex: 1; padding: 10px; border-radius: 30px; border: 1px solid #bdc3c7; }
        .lista-admin { max-height: 180px; overflow-y: auto; }
        .produto-admin { display: flex; justify-content: space-between; background: white; margin: 5px 0; padding: 8px 12px; border-radius: 40px; }
        @media (max-width: 500px) { .produtos-grid { grid-template-columns: 1fr 1fr; } }
        .erro-msg { background: #e74c3c; color: white; border-radius: 30px; padding: 8px 12px; margin: 8px 0; text-align: center; }
    </style>
</head>
<body>

<div class="comandas-header">
    <label>🍽️ Comanda atual:</label>
    <select id="selectMesa" class="mesa-select"></select>
    <button id="btnNovaMesa" class="btn-nova-mesa">➕ Nova Mesa</button>
    <button id="btnTestarImpressora" class="btn-testar">🖨️ Testar Impressora (USB direto)</button>
</div>
<div id="listaBadges" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;"></div>

<div id="produtosContainer" class="produtos-grid"></div>

<div class="carrinho">
    <h2 id="tituloComanda">🛒 Pedido - Mesa</h2>
    <div id="carrinhoLista"></div>
    <div id="totalCarrinho" class="total">Total: R$ 0,00</div>
    <div class="acoes-carrinho">
        <button id="limparComanda" class="btn-limpar-comanda">🗑️ Limpar pedido</button>
        <button id="imprimirCompleto" class="btn-imprimir-completo">🖨️ Imprimir pedido completo (USB)</button>
    </div>
</div>

<div class="admin-panel">
    <h3>⚙️ Administrar cardápio</h3>
    <div class="form-produto">
        <input type="text" id="novoNome" placeholder="Nome do produto">
        <input type="number" id="novoPreco" placeholder="Preço (R$)" step="0.01">
        <button id="adicionarProdutoBtn">➕ Adicionar</button>
    </div>
    <div id="listaProdutosAdmin" class="lista-admin"></div>
    <small>Clique no "X" para remover produto permanentemente</small>
</div>

<script>
    // ---------- DADOS ----------
    let produtos = [];
    let comandas = {};
    let comandaAtiva = "Mesa 1";
    let device = null;
    let outEndpoint = null;

    const produtosIniciais = [
        { nome: "Virado à Mineira", preco: 35.00 },
        { nome: "Macarrão na Bateia", preco: 30.00 },
        { nome: "Meia Porção - Virado à Mineira", preco: 20.00 },
        { nome: "Meia Porção - Macarrão na Bateia", preco: 20.00 },
        { nome: "Ovo", preco: 2.00 },
        { nome: "Porção de Arroz", preco: 10.00 },
        { nome: "Torresmo", preco: 10.00 },
        { nome: "Conserva de Jiló com Cebola Roxa - 240mL", preco: 15.00 },
        { nome: "Conserva de Jiló com Cebola Roxa - 500mL", preco: 30.00 }
    ];

    // Storage
    function carregarProdutos() {
        const saved = localStorage.getItem("cardapio_produtos");
        if(saved) produtos = JSON.parse(saved);
        else produtos = produtosIniciais.map((p, i) => ({ id: Date.now()+i, nome: p.nome, preco: p.preco }));
    }
    function carregarComandas() {
        const saved = localStorage.getItem("cardapio_comandas");
        if(saved) comandas = JSON.parse(saved);
        else comandas = { "Mesa 1": [] };
        const ativa = localStorage.getItem("cardapio_comanda_ativa");
        comandaAtiva = (ativa && comandas[ativa]) ? ativa : Object.keys(comandas)[0];
    }
    function salvarProdutos() { localStorage.setItem("cardapio_produtos", JSON.stringify(produtos)); }
    function salvarComandas() { localStorage.setItem("cardapio_comandas", JSON.stringify(comandas)); localStorage.setItem("cardapio_comanda_ativa", comandaAtiva); }
    function getCarrinhoAtual() { if(!comandas[comandaAtiva]) comandas[comandaAtiva] = []; return comandas[comandaAtiva]; }
    function setCarrinhoAtual(novo) { comandas[comandaAtiva] = novo; salvarComandas(); renderizarCarrinho(); }

    // ---------- UI ----------
    function renderizarCardapio() {
        const container = document.getElementById("produtosContainer");
        if(!container) return;
        container.innerHTML = "";
        produtos.forEach(prod => {
            const card = document.createElement("div");
            card.className = "card-produto";
            card.innerHTML = `
                <h3>${escapeHTML(prod.nome)}</h3>
                <div class="preco">R$ ${prod.preco.toFixed(2)}</div>
                <div class="qtd-controle">
                    <button class="btn-qtd-menos" data-id="${prod.id}">-</button>
                    <span id="qtd-${prod.id}">0</span>
                    <button class="btn-qtd-mais" data-id="${prod.id}">+</button>
                </div>
                <button class="add-btn" data-id="${prod.id}" data-nome="${prod.nome}" data-preco="${prod.preco}">Adicionar</button>
            `;
            container.appendChild(card);
        });
        document.querySelectorAll(".btn-qtd-menos").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                const span = document.getElementById(`qtd-${id}`);
                let val = parseInt(span.innerText) || 0;
                if(val > 0) val--;
                span.innerText = val;
            });
        });
        document.querySelectorAll(".btn-qtd-mais").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                const span = document.getElementById(`qtd-${id}`);
                let val = parseInt(span.innerText) || 0;
                val++;
                span.innerText = val;
            });
        });
        document.querySelectorAll(".add-btn").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                const nome = btn.dataset.nome;
                const preco = parseFloat(btn.dataset.preco);
                const qtdSpan = document.getElementById(`qtd-${id}`);
                let quantidade = parseInt(qtdSpan.innerText) || 0;
                if(quantidade <= 0) quantidade = 1;
                adicionarAoCarrinho(id, nome, preco, quantidade);
                qtdSpan.innerText = "0";
            });
        });
    }

    function adicionarAoCarrinho(id, nome, preco, quantidade) {
        let carrinho = getCarrinhoAtual();
        const idx = carrinho.findIndex(item => item.id === id);
        if(idx !== -1) carrinho[idx].quantidade += quantidade;
        else carrinho.push({ id, nome, preco, quantidade });
        setCarrinhoAtual(carrinho);
    }

    function renderizarCarrinho() {
        const listaDiv = document.getElementById("carrinhoLista");
        const totalDiv = document.getElementById("totalCarrinho");
        const tituloSpan = document.getElementById("tituloComanda");
        if(tituloSpan) tituloSpan.innerText = `🛒 Pedido - ${comandaAtiva}`;
        const carrinho = getCarrinhoAtual();
        if(carrinho.length === 0) {
            listaDiv.innerHTML = "<p style='text-align:center;'>Carrinho vazio</p>";
            totalDiv.innerText = "Total: R$ 0,00";
            return;
        }
        let html = "", total = 0;
        carrinho.forEach((item, idx) => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            html += `
                <div class="item-carrinho">
                    <div><strong>${escapeHTML(item.nome)}</strong> x ${item.quantidade} - R$ ${subtotal.toFixed(2)}</div>
                    <div>
                        <button class="btn-imprimir-item" data-idx="${idx}" data-nome="${item.nome}" data-preco="${item.preco}" data-qtd="${item.quantidade}">🖨️ Item (USB)</button>
                        <button class="btn-remover-item" data-idx="${idx}">🗑️</button>
                    </div>
                </div>
            `;
        });
        listaDiv.innerHTML = html;
        totalDiv.innerText = `Total: R$ ${total.toFixed(2)}`;
        document.querySelectorAll(".btn-remover-item").forEach(btn => {
            btn.addEventListener("click", (e) => {
                let carrinho = getCarrinhoAtual();
                carrinho.splice(parseInt(btn.dataset.idx), 1);
                setCarrinhoAtual(carrinho);
            });
        });
        document.querySelectorAll(".btn-imprimir-item").forEach(btn => {
            btn.addEventListener("click", async (e) => {
                const item = {
                    nome: btn.dataset.nome,
                    preco: parseFloat(btn.dataset.preco),
                    quantidade: parseInt(btn.dataset.qtd)
                };
                await imprimirItens([item]);
            });
        });
    }

    function renderAdminProdutos() {
        const container = document.getElementById("listaProdutosAdmin");
        if(!container) return;
        container.innerHTML = "";
        produtos.forEach(prod => {
            const div = document.createElement("div");
            div.className = "produto-admin";
            div.innerHTML = `<span>${escapeHTML(prod.nome)} - R$ ${prod.preco.toFixed(2)}</span><button class="remover-produto-admin" data-id="${prod.id}">X</button>`;
            container.appendChild(div);
        });
        document.querySelectorAll(".remover-produto-admin").forEach(btn => {
            btn.addEventListener("click", (e) => {
                const id = parseInt(btn.dataset.id);
                produtos = produtos.filter(p => p.id !== id);
                salvarProdutos();
                renderAdminProdutos();
                renderizarCardapio();
            });
        });
    }

    function adicionarProdutoAdmin(nome, preco) {
        if(!nome.trim() || isNaN(preco) || preco <= 0) return false;
        produtos.push({ id: Date.now(), nome: nome.trim(), preco: parseFloat(preco) });
        salvarProdutos();
        renderAdminProdutos();
        renderizarCardapio();
        return true;
    }

    // ---------- GERENCIAR COMANDAS ----------
    function renderizarSelecaoComandas() {
        const select = document.getElementById("selectMesa");
        const badgesDiv = document.getElementById("listaBadges");
        if(!select) return;
        const keys = Object.keys(comandas);
        select.innerHTML = "";
        keys.forEach(key => {
            const opt = document.createElement("option");
            opt.value = key;
            opt.textContent = key;
            if(key === comandaAtiva) opt.selected = true;
            select.appendChild(opt);
        });
        badgesDiv.innerHTML = "";
        keys.forEach(key => {
            const badge = document.createElement("span");
            badge.className = "badge-mesa" + (key === comandaAtiva ? " ativa" : "");
            badge.innerHTML = `${key} <button class="remover-mesa" data-mesa="${key}">✖</button>`;
            badgesDiv.appendChild(badge);
        });
        document.querySelectorAll(".remover-mesa").forEach(btn => {
            btn.addEventListener("click", () => {
                const mesa = btn.dataset.mesa;
                if(Object.keys(comandas).length === 1) { alert("Não pode remover a única comanda."); return; }
                if(confirm(`Remover ${mesa}?`)) {
                    delete comandas[mesa];
                    if(comandaAtiva === mesa) comandaAtiva = Object.keys(comandas)[0];
                    salvarComandas();
                    renderizarSelecaoComandas();
                    renderizarCarrinho();
                }
            });
        });
    }

    function novaComanda() {
        let n = 1;
        while(comandas[`Mesa ${n}`]) n++;
        const nome = `Mesa ${n}`;
        comandas[nome] = [];
        comandaAtiva = nome;
        salvarComandas();
        renderizarSelecaoComandas();
        renderizarCarrinho();
    }

    function mudarComanda(mesa) {
        if(comandas[mesa]) {
            comandaAtiva = mesa;
            salvarComandas();
            renderizarSelecaoComandas();
            renderizarCarrinho();
        }
    }

    // ---------- IMPRESSÃO USB DIRETA (sem fallback) ----------
    async function conectarImpressora() {
        try {
            const devices = await navigator.usb.getDevices();
            if (devices.length > 0) {
                device = devices[0];
                console.log("Usando dispositivo já autorizado:", device);
                await prepararEndpoint();
                return true;
            }
            const usbDevice = await navigator.usb.requestDevice({ filters: [] });
            device = usbDevice;
            await prepararEndpoint();
            return true;
        } catch (error) {
            console.error("Erro na conexão USB:", error);
            mostrarErro("Não foi possível conectar à impressora: " + error.message);
            return false;
        }
    }

    async function prepararEndpoint() {
        if (!device) return false;
        await device.open();
        await device.selectConfiguration(1);
        let interfaceIndex = -1;
        for (let i = 0; i < device.configuration.interfaces.length; i++) {
            const iface = device.configuration.interfaces[i];
            for (let alt of iface.alternates) {
                const outEp = alt.endpoints.find(ep => ep.direction === "out");
                if (outEp) {
                    interfaceIndex = i;
                    outEndpoint = outEp.endpointNumber;
                    break;
                }
            }
            if (interfaceIndex !== -1) break;
        }
        if (interfaceIndex === -1) throw new Error("Nenhum endpoint OUT encontrado.");
        await device.claimInterface(interfaceIndex);
        console.log(`Interface ${interfaceIndex} reivindicada, endpoint OUT = ${outEndpoint}`);
        return true;
    }

    async function enviarComandoESC_POS(linhasArray) {
        if (!device || !outEndpoint) {
            const ok = await conectarImpressora();
            if (!ok) return false;
        }
        try {
            const encoder = new TextEncoder();
            const init = new Uint8Array([0x1B, 0x40]);
            const center = new Uint8Array([0x1B, 0x61, 0x01]);
            const left = new Uint8Array([0x1B, 0x61, 0x00]);
            const boldOn = new Uint8Array([0x1B, 0x45, 0x01]);
            const boldOff = new Uint8Array([0x1B, 0x45, 0x00]);
            const normalWidth = new Uint8Array([0x1D, 0x21, 0x00]);
            const cut = new Uint8Array([0x1D, 0x56, 0x42, 0x00]);

            let dados = [init, normalWidth, center, boldOn, encoder.encode("CARDÁPIO DIGITAL\n"), boldOff, encoder.encode("-------------------------------\n"), left];
            for (let linha of linhasArray) {
                let linhaLimitada = linha.length > 48 ? linha.substring(0,45)+"..." : linha;
                dados.push(encoder.encode(linhaLimitada + "\n"));
            }
            dados.push(encoder.encode("-------------------------------\n"), cut);
            for (const bloco of dados) {
                await device.transferOut(outEndpoint, bloco);
            }
            return true;
        } catch (err) {
            console.error("Erro ao enviar dados USB:", err);
            mostrarErro("Erro na transmissão USB: " + err.message);
            return false;
        }
    }

    function mostrarErro(mensagem) {
        // Exibe erro no próprio HTML (sem caixa de diálogo)
        let errorDiv = document.getElementById("erroGlobal");
        if (!errorDiv) {
            errorDiv = document.createElement("div");
            errorDiv.id = "erroGlobal";
            errorDiv.className = "erro-msg";
            document.body.prepend(errorDiv);
        }
        errorDiv.innerText = "⚠️ " + mensagem;
        errorDiv.style.display = "block";
        setTimeout(() => { errorDiv.style.display = "none"; }, 5000);
    }

    async function imprimirItens(itens) {
        if (!itens.length) return;
        if (!("usb" in navigator)) {
            mostrarErro("WebUSB não é suportado neste navegador. Use Chrome no Android para impressão direta.");
            return;
        }
        const linhas = [];
        linhas.push(`${comandaAtiva} - Item individual`);
        itens.forEach(item => {
            const subtotal = item.preco * item.quantidade;
            linhas.push(`${item.nome}  x${item.quantidade}  R$ ${subtotal.toFixed(2)}`);
        });
        linhas.push(`Data: ${new Date().toLocaleString()}`);
        
        const ok = await enviarComandoESC_POS(linhas);
        if (ok) {
            alert("✅ Item impresso diretamente via USB!");
        } else {
            mostrarErro("Falha na impressão USB. Verifique a conexão e tente novamente.");
        }
    }

    async function imprimirPedidoCompleto() {
        const carrinho = getCarrinhoAtual();
        if (carrinho.length === 0) {
            mostrarErro("Carrinho vazio. Adicione itens antes de imprimir.");
            return;
        }
        if (!("usb" in navigator)) {
            mostrarErro("WebUSB não suportado. Use Chrome no Android.");
            return;
        }
        const linhas = [`${comandaAtiva}`, "--- Itens do pedido ---"];
        let total = 0;
        carrinho.forEach(item => {
            const subtotal = item.preco * item.quantidade;
            total += subtotal;
            linhas.push(`${item.nome} x${item.quantidade}  R$ ${subtotal.toFixed(2)}`);
        });
        linhas.push(`TOTAL: R$ ${total.toFixed(2)}`, `Data: ${new Date().toLocaleString()}`);
        
        const ok = await enviarComandoESC_POS(linhas);
        if (ok) {
            alert("✅ Pedido completo impresso diretamente via USB!");
            if (confirm("Limpar carrinho após impressão?")) {
                setCarrinhoAtual([]);
            }
        } else {
            mostrarErro("Falha na impressão USB. Verifique a conexão.");
        }
    }

    async function testarImpressora() {
        if (!("usb" in navigator)) {
            mostrarErro("WebUSB não suportado. Use Chrome no Android.");
            return;
        }
        const ok = await conectarImpressora();
        if (ok) {
            const linhaTeste = "123456789012345678901234567890123456789012345678";
            const teste = await enviarComandoESC_POS([
                "=== TESTE 80mm (USB direto) ===",
                "Esta impressão não abriu caixa de diálogo.",
                "A comunicação é direta via ESC/POS.",
                linhaTeste,
                "Fim do teste - " + new Date().toLocaleString()
            ]);
            if (teste) {
                alert("✅ Teste enviado com sucesso! Verifique a impressora.");
            } else {
                mostrarErro("Falha ao enviar teste. Verifique se a impressora está pronta.");
            }
        } else {
            mostrarErro("Não foi possível conectar à impressora.");
        }
    }

    function escapeHTML(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    // Eventos
    document.addEventListener("DOMContentLoaded", () => {
        carregarProdutos();
        carregarComandas();
        renderizarCardapio();
        renderizarCarrinho();
        renderAdminProdutos();
        renderizarSelecaoComandas();

        document.getElementById("selectMesa")?.addEventListener("change", e => mudarComanda(e.target.value));
        document.getElementById("btnNovaMesa")?.addEventListener("click", novaComanda);
        document.getElementById("limparComanda")?.addEventListener("click", () => { if(confirm("Limpar todos os itens?")) setCarrinhoAtual([]); });
        document.getElementById("imprimirCompleto")?.addEventListener("click", imprimirPedidoCompleto);
        document.getElementById("btnTestarImpressora")?.addEventListener("click", testarImpressora);
        document.getElementById("adicionarProdutoBtn")?.addEventListener("click", () => {
            const nome = document.getElementById("novoNome").value;
            const preco = parseFloat(document.getElementById("novoPreco").value);
            if(adicionarProdutoAdmin(nome, preco)) { document.getElementById("novoNome").value = ""; document.getElementById("novoPreco").value = ""; }
            else alert("Preencha nome e preço válido.");
        });
    });
</script>
</body>
</html>
