<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio & Comandas</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #222;
    --border: #2e2e2e;
    --accent: #e8c547;
    --accent2: #e87047;
    --green: #4caf7d;
    --red: #e05252;
    --text: #f0f0f0;
    --muted: #777;
    --radius: 16px;
    --radius-sm: 10px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* HEADER */
  .app-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .app-title {
    font-family: 'Syne', sans-serif;
    font-size: 1.3rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .app-title span { color: var(--text); }
  .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

  /* TABS */
  .tabs {
    display: flex;
    gap: 4px;
    padding: 12px 20px 0;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    overflow-x: auto;
  }
  .tab-btn {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 10px 18px;
    border: none;
    border-radius: var(--radius-sm) var(--radius-sm) 0 0;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
    border-bottom: 2px solid transparent;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active {
    color: var(--accent);
    background: var(--bg);
    border-bottom: 2px solid var(--accent);
  }

  /* MAIN */
  .main { padding: 20px; max-width: 900px; margin: 0 auto; }
  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  /* MESA SELECTOR */
  .mesa-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .mesa-label { font-size: 0.8rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
  .mesa-chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1; }
  .mesa-chip {
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    padding: 6px 14px;
    border-radius: 40px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
  }
  .mesa-chip:hover { border-color: var(--accent); color: var(--accent); }
  .mesa-chip.active { background: var(--accent); border-color: var(--accent); color: #000; }
  .mesa-chip .chip-del {
    font-size: 0.7rem;
    opacity: 0.6;
    padding: 0 2px;
    cursor: pointer;
  }
  .mesa-chip.active .chip-del { opacity: 0.5; color: #000; }

  /* BTN styles */
  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    padding: 8px 16px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .btn-ghost { background: transparent; color: var(--muted); border: 1.5px solid var(--border); }
  .btn-ghost:hover { border-color: var(--text); color: var(--text); }
  .btn-accent { background: var(--accent); color: #000; }
  .btn-accent:hover { background: #f0d060; }
  .btn-green { background: var(--green); color: #fff; }
  .btn-green:hover { background: #5dc98e; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: #f06060; }
  .btn-orange { background: var(--accent2); color: #fff; }
  .btn-orange:hover { background: #f08050; }
  .btn-sm { padding: 5px 12px; font-size: 0.75rem; }

  /* PRODUTO CARDS */
  .produtos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 12px;
    margin-bottom: 28px;
  }
  .card-produto {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    transition: border-color 0.15s;
  }
  .card-produto:hover { border-color: #444; }
  .prod-nome {
    font-family: 'Syne', sans-serif;
    font-size: 0.85rem;
    font-weight: 700;
    line-height: 1.3;
    flex: 1;
  }
  .prod-preco {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--accent);
  }
  .qtd-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .qtd-btn {
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }
  .qtd-btn:hover { border-color: var(--accent); color: var(--accent); }
  .qtd-val {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    min-width: 24px;
    text-align: center;
  }
  .card-btns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .ficha-btn {
    padding: 9px;
    border-radius: var(--radius-sm);
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .ficha-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  .add-prod-btn {
    width: 100%;
    padding: 9px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--accent);
    color: #000;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.8rem;
    cursor: pointer;
    transition: background 0.15s;
  }
  .add-prod-btn:hover { background: #f0d060; }

  /* CARRINHO */
  .carrinho-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
  }
  .carrinho-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .carrinho-titulo {
    font-family: 'Syne', sans-serif;
    font-size: 1rem;
    font-weight: 800;
  }
  .carrinho-body { padding: 8px 0; min-height: 60px; }
  .carrinho-vazio {
    text-align: center;
    color: var(--muted);
    font-size: 0.9rem;
    padding: 32px;
  }
  .item-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .item-info { flex: 1; min-width: 140px; }
  .item-nome { font-size: 0.9rem; font-weight: 500; }
  .item-detalhe { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
  .item-subtotal { font-family: 'Syne', sans-serif; font-weight: 700; color: var(--accent); font-size: 0.95rem; min-width: 70px; text-align: right; }
  .item-acoes { display: flex; gap: 6px; }
  .carrinho-footer {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  .total-label { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; }
  .total-val { color: var(--accent); }
  .footer-acoes { display: flex; gap: 8px; flex-wrap: wrap; }

  /* IMPRESSORA STATUS */
  .printer-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 16px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    margin-bottom: 20px;
    font-size: 0.82rem;
  }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
    transition: background 0.3s;
  }
  .status-dot.conectado { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .status-dot.erro { background: var(--red); }
  .status-text { flex: 1; color: var(--muted); }

  /* ADMIN */
  .admin-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    margin-bottom: 20px;
  }
  .admin-header {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 0.9rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .admin-body { padding: 16px 20px; }
  .form-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .inp {
    flex: 1;
    min-width: 120px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.9rem;
    transition: border-color 0.15s;
  }
  .inp:focus { outline: none; border-color: var(--accent); }
  .inp::placeholder { color: var(--muted); }
  .lista-admin { display: flex; flex-direction: column; gap: 6px; max-height: 240px; overflow-y: auto; }
  .prod-admin-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 0.85rem;
  }
  .prod-admin-nome { flex: 1; }
  .prod-admin-preco { color: var(--accent); margin: 0 12px; font-weight: 500; }

  /* TOAST */
  .toast-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 8px;
    pointer-events: none;
  }
  .toast {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 0.85rem;
    padding: 12px 20px;
    border-radius: 40px;
    color: #fff;
    white-space: nowrap;
    animation: toastIn 0.25s ease, toastOut 0.3s ease 2.7s forwards;
    pointer-events: auto;
  }
  .toast.sucesso { background: var(--green); }
  .toast.erro { background: var(--red); }
  .toast.info { background: #444; }
  @keyframes toastIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
  @keyframes toastOut { from { opacity:1; } to { opacity:0; transform:translateY(8px); } }

  @media (max-width: 500px) {
    .main { padding: 12px; }
    .produtos-grid { grid-template-columns: 1fr 1fr; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="app-title">🍽 Cardápio <span>& Comandas</span></div>
  <div class="header-actions">
    <button class="btn btn-ghost" id="btnNovaMesa">➕ Nova Mesa</button>
    <button class="btn btn-ghost" id="btnConectar">🔌 Conectar Impressora</button>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" data-tab="pedido">🛒 Pedido</button>
  <button class="tab-btn" data-tab="admin">⚙️ Cardápio</button>
</div>

<div class="main">

  <!-- PEDIDO TAB -->
  <div class="tab-panel active" id="tab-pedido">
    <div class="mesa-bar">
      <span class="mesa-label">Mesa</span>
      <div class="mesa-chips" id="mesaChips"></div>
    </div>

    <div class="printer-status">
      <div class="status-dot" id="statusDot"></div>
      <span class="status-text" id="statusText">Impressora não conectada</span>
      <button class="btn btn-ghost btn-sm" id="btnTestar">Testar</button>
    </div>

    <div id="produtosGrid" class="produtos-grid"></div>

    <div class="carrinho-section">
      <div class="carrinho-header">
        <span class="carrinho-titulo" id="carrinhoTitulo">🛒 Pedido — Mesa 1</span>
        <button class="btn btn-ghost btn-sm" id="btnLimpar">🗑 Limpar</button>
      </div>
      <div class="carrinho-body" id="carrinhoBody">
        <div class="carrinho-vazio">Nenhum item adicionado</div>
      </div>
      <div class="carrinho-footer">
        <span class="total-label">Total: <span class="total-val" id="totalVal">R$ 0,00</span></span>
        <div class="footer-acoes">
          <button class="btn btn-orange" id="btnImprimirCompleto">🖨 Imprimir Pedido</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ADMIN TAB -->
  <div class="tab-panel" id="tab-admin">
    <div class="admin-section">
      <div class="admin-header">Adicionar produto</div>
      <div class="admin-body">
        <div class="form-row">
          <input class="inp" id="inputNome" placeholder="Nome do produto" />
          <input class="inp" id="inputPreco" type="number" placeholder="Preço (R$)" step="0.01" style="max-width:140px" />
          <button class="btn btn-green" id="btnAdicionarProd">➕ Adicionar</button>
        </div>
        <div id="listaProdAdmin" class="lista-admin"></div>
      </div>
    </div>
  </div>

</div>

<div class="toast-container" id="toastContainer"></div>

<script>
// ============================================================
// ESTADO
// ============================================================
let produtos = [];
let comandas = {};
let comandaAtiva = "Mesa 1";

let usbDevice = null;
let usbEndpoint = null;
let usbInterface = null;

const PRODUTOS_PADRAO = [
  { nome: "Virado à Mineira", preco: 35.00 },
  { nome: "Macarrão na Bateia", preco: 30.00 },
  { nome: "Meia Porção - Virado à Mineira", preco: 20.00 },
  { nome: "Meia Porção - Macarrão na Bateia", preco: 20.00 },
  { nome: "Ovo", preco: 2.00 },
  { nome: "Porção de Arroz", preco: 10.00 },
  { nome: "Torresmo", preco: 10.00 },
  { nome: "Conserva de Jiló 240mL", preco: 15.00 },
  { nome: "Conserva de Jiló 500mL", preco: 30.00 },
];

// ============================================================
// STORAGE
// ============================================================
function salvar() {
  localStorage.setItem("cmd_produtos", JSON.stringify(produtos));
  localStorage.setItem("cmd_comandas", JSON.stringify(comandas));
  localStorage.setItem("cmd_ativa", comandaAtiva);
}

function carregar() {
  const p = localStorage.getItem("cmd_produtos");
  const c = localStorage.getItem("cmd_comandas");
  const a = localStorage.getItem("cmd_ativa");

  produtos = p ? JSON.parse(p) : PRODUTOS_PADRAO.map((x, i) => ({ id: Date.now() + i, ...x }));
  comandas = c ? JSON.parse(c) : { "Mesa 1": [] };
  const keys = Object.keys(comandas);
  comandaAtiva = (a && comandas[a]) ? a : keys[0];
}

function getCarrinho() {
  if (!comandas[comandaAtiva]) comandas[comandaAtiva] = [];
  return comandas[comandaAtiva];
}

// ============================================================
// TOAST
// ============================================================
function toast(msg, tipo = "info") {
  const el = document.createElement("div");
  el.className = `toast ${tipo}`;
  el.textContent = msg;
  document.getElementById("toastContainer").appendChild(el);
  setTimeout(() => el.remove(), 3200);
}

// ============================================================
// RENDER CARDÁPIO
// ============================================================
function renderCardapio() {
  const grid = document.getElementById("produtosGrid");
  grid.innerHTML = "";
  produtos.forEach(p => {
    const card = document.createElement("div");
    card.className = "card-produto";
    card.innerHTML = `
      <div class="prod-nome">${esc(p.nome)}</div>
      <div class="prod-preco">R$ ${p.preco.toFixed(2)}</div>
      <div class="qtd-row">
        <button class="qtd-btn" data-id="${p.id}" data-op="menos">−</button>
        <span class="qtd-val" id="qtd-${p.id}">1</span>
        <button class="qtd-btn" data-id="${p.id}" data-op="mais">+</button>
      </div>
      <div class="card-btns">
        <button class="ficha-btn" data-id="${p.id}">&#128424; Ficha</button>
        <button class="add-prod-btn" data-id="${p.id}">+ Pedido</button>
      </div>
    `;
    grid.appendChild(card);
  });

  grid.querySelectorAll(".qtd-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const span = document.getElementById(`qtd-${btn.dataset.id}`);
      let v = parseInt(span.textContent);
      if (btn.dataset.op === "mais") v++;
      else if (v > 1) v--;
      span.textContent = v;
    });
  });

  grid.querySelectorAll(".add-prod-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = produtos.find(x => x.id === parseInt(btn.dataset.id));
      if (!p) return;
      const qtd = parseInt(document.getElementById(`qtd-${p.id}`).textContent) || 1;
      adicionarItem(p, qtd);
      document.getElementById(`qtd-${p.id}`).textContent = "1";
      toast(`${p.nome} adicionado`, "sucesso");
    });
  });

  grid.querySelectorAll(".ficha-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const p = produtos.find(x => x.id === parseInt(btn.dataset.id));
      if (!p) return;
      const qtd = parseInt(document.getElementById(`qtd-${p.id}`).textContent) || 1;
      imprimirFicha(p, qtd);
    });
  });
}

// ============================================================
// RENDER ADMIN
// ============================================================
function renderAdmin() {
  const lista = document.getElementById("listaProdAdmin");
  lista.innerHTML = "";
  produtos.forEach(p => {
    const row = document.createElement("div");
    row.className = "prod-admin-row";
    row.innerHTML = `
      <span class="prod-admin-nome">${esc(p.nome)}</span>
      <span class="prod-admin-preco">R$ ${p.preco.toFixed(2)}</span>
      <button class="btn btn-red btn-sm" data-id="${p.id}">Remover</button>
    `;
    lista.appendChild(row);
  });
  lista.querySelectorAll(".btn-red").forEach(btn => {
    btn.addEventListener("click", () => {
      produtos = produtos.filter(x => x.id !== parseInt(btn.dataset.id));
      salvar();
      renderAdmin();
      renderCardapio();
    });
  });
}

// ============================================================
// RENDER MESAS
// ============================================================
function renderMesas() {
  const container = document.getElementById("mesaChips");
  container.innerHTML = "";
  Object.keys(comandas).forEach(mesa => {
    const chip = document.createElement("button");
    chip.className = "mesa-chip" + (mesa === comandaAtiva ? " active" : "");
    chip.innerHTML = `${esc(mesa)} <span class="chip-del" data-mesa="${esc(mesa)}">✕</span>`;
    chip.addEventListener("click", (e) => {
      if (e.target.classList.contains("chip-del")) {
        removerMesa(e.target.dataset.mesa);
      } else {
        trocarMesa(mesa);
      }
    });
    container.appendChild(chip);
  });
}

function trocarMesa(nome) {
  comandaAtiva = nome;
  salvar();
  renderMesas();
  renderCarrinho();
}

function novaMesa() {
  let n = 1;
  while (comandas[`Mesa ${n}`]) n++;
  const nome = `Mesa ${n}`;
  comandas[nome] = [];
  comandaAtiva = nome;
  salvar();
  renderMesas();
  renderCarrinho();
}

function removerMesa(nome) {
  if (Object.keys(comandas).length <= 1) { toast("Não é possível remover a única mesa", "erro"); return; }
  if (!confirm(`Remover ${nome}?`)) return;
  delete comandas[nome];
  if (comandaAtiva === nome) comandaAtiva = Object.keys(comandas)[0];
  salvar();
  renderMesas();
  renderCarrinho();
}

// ============================================================
// CARRINHO
// ============================================================
function adicionarItem(prod, qtd) {
  const c = getCarrinho();
  const idx = c.findIndex(x => x.id === prod.id);
  if (idx >= 0) c[idx].qtd += qtd;
  else c.push({ id: prod.id, nome: prod.nome, preco: prod.preco, qtd });
  salvar();
  renderCarrinho();
}

function removerItem(idx) {
  const c = getCarrinho();
  c.splice(idx, 1);
  salvar();
  renderCarrinho();
}

function renderCarrinho() {
  const body = document.getElementById("carrinhoBody");
  const totalEl = document.getElementById("totalVal");
  const titulo = document.getElementById("carrinhoTitulo");
  titulo.textContent = `🛒 Pedido — ${comandaAtiva}`;

  const c = getCarrinho();
  if (c.length === 0) {
    body.innerHTML = `<div class="carrinho-vazio">Nenhum item adicionado</div>`;
    totalEl.textContent = "R$ 0,00";
    return;
  }

  let total = 0;
  body.innerHTML = "";
  c.forEach((item, idx) => {
    const sub = item.preco * item.qtd;
    total += sub;
    const row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML = `
      <div class="item-info">
        <div class="item-nome">${esc(item.nome)}</div>
        <div class="item-detalhe">R$ ${item.preco.toFixed(2)} × ${item.qtd}</div>
      </div>
      <div class="item-subtotal">R$ ${sub.toFixed(2)}</div>
      <div class="item-acoes">
        <button class="btn btn-orange btn-sm btn-print-item" data-idx="${idx}">🖨</button>
        <button class="btn btn-red btn-sm btn-del-item" data-idx="${idx}">✕</button>
      </div>
    `;
    body.appendChild(row);
  });

  totalEl.textContent = `R$ ${total.toFixed(2)}`;

  body.querySelectorAll(".btn-del-item").forEach(btn => {
    btn.addEventListener("click", () => removerItem(parseInt(btn.dataset.idx)));
  });

  body.querySelectorAll(".btn-print-item").forEach(btn => {
    btn.addEventListener("click", () => {
      const item = getCarrinho()[parseInt(btn.dataset.idx)];
      if (item) imprimirItens([item]);
    });
  });
}

// ============================================================
// USB / IMPRESSORA
// ============================================================
function setStatus(msg, estado) {
  document.getElementById("statusText").textContent = msg;
  const dot = document.getElementById("statusDot");
  dot.className = "status-dot" + (estado ? ` ${estado}` : "");
}

async function desconectarUSB() {
  try {
    if (usbInterface !== null && usbDevice) await usbDevice.releaseInterface(usbInterface);
    if (usbDevice && usbDevice.opened) await usbDevice.close();
  } catch (e) { console.warn("Erro ao desconectar:", e); }
  usbDevice = null;
  usbEndpoint = null;
  usbInterface = null;
}

async function conectarUSB() {
  if (!("usb" in navigator)) {
    toast("WebUSB não suportado. Use Chrome no Android.", "erro");
    return false;
  }

  // Se já está conectado e funcional, ok
  if (usbDevice && usbDevice.opened && usbEndpoint !== null) return true;

  // Limpa conexão anterior
  await desconectarUSB();
  setStatus("Conectando...", "");

  try {
    const autorizados = await navigator.usb.getDevices();
    usbDevice = autorizados.length > 0
      ? autorizados[0]
      : await navigator.usb.requestDevice({ filters: [] });

    if (!usbDevice.opened) await usbDevice.open();
    await usbDevice.selectConfiguration(1);

    let ifaceIdx = -1;
    for (let i = 0; i < usbDevice.configuration.interfaces.length; i++) {
      for (const alt of usbDevice.configuration.interfaces[i].alternates) {
        const ep = alt.endpoints.find(e => e.direction === "out");
        if (ep) { ifaceIdx = i; usbEndpoint = ep.endpointNumber; break; }
      }
      if (ifaceIdx !== -1) break;
    }

    if (ifaceIdx === -1) throw new Error("Nenhum endpoint de saída encontrado.");

    await usbDevice.claimInterface(ifaceIdx);
    usbInterface = ifaceIdx;

    setStatus(`Conectado: ${usbDevice.productName || "Impressora USB"}`, "conectado");
    return true;

  } catch (err) {
    console.error("Erro USB:", err);
    setStatus("Falha na conexão", "erro");
    toast("Erro USB: " + err.message, "erro");
    await desconectarUSB();
    return false;
  }
}

// Remove acentos e caracteres fora do ASCII
function removerAcentos(texto) {
  return texto
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")  // remove diacríticos (á→a, ç→c, etc)
    .replace(/[^\x00-\x7F]/g, "");    // remove qualquer coisa fora do ASCII
}

// Converte texto para bytes Latin-1 sem acentos (compatível com ESC/POS)
function toLatin1(texto) {
  const limpo = removerAcentos(texto);
  const bytes = new Uint8Array(limpo.length);
  for (let i = 0; i < limpo.length; i++) {
    bytes[i] = limpo.charCodeAt(i) & 0xFF;
  }
  return bytes;
}

async function enviarESCPOS(linhas) {
  const ok = await conectarUSB();
  if (!ok) return false;

  try {
    // 0x1D 0x21 0x11 = altura x2 + largura x2 (fonte grande)
    // 0x1D 0x21 0x10 = só largura x2
    // 0x1D 0x21 0x01 = só altura x2
    // 0x1D 0x21 0x00 = tamanho normal
    const fontGrande    = new Uint8Array([0x1D, 0x21, 0x11]); // dobra largura e altura
    const fontNormal    = new Uint8Array([0x1D, 0x21, 0x00]);
    const fontMedio     = new Uint8Array([0x1D, 0x21, 0x01]); // só altura x2

    const blocos = [
      new Uint8Array([0x1B, 0x40]),       // inicializar
      new Uint8Array([0x1B, 0x74, 0x00]), // charset PC437 (ASCII puro, mais compatível)
      new Uint8Array([0x1B, 0x61, 0x01]), // centralizar
      new Uint8Array([0x1B, 0x45, 0x01]), // bold on
      fontGrande,
      toLatin1("CARDAPIO\n"),
      fontNormal,
      new Uint8Array([0x1B, 0x45, 0x00]), // bold off
      toLatin1("--------------------------------\n"),
      new Uint8Array([0x1B, 0x61, 0x00]), // alinhar esquerda
    ];

    for (const linha of linhas) {
      // Linhas que começam com espaço são detalhes (preço/qtd) — fonte normal
      // Demais são nomes de produtos — fonte média (altura dupla)
      const ehDetalhe = linha.startsWith("  ") || linha.startsWith("---") || linha.startsWith("TOTAL") || linha.startsWith("Data");
      if (ehDetalhe) {
        blocos.push(fontNormal);
      } else {
        blocos.push(fontMedio); // altura x2 para nomes e títulos
      }
      const limitada = linha.length > 32 ? linha.substring(0, 29) + "..." : linha;
      blocos.push(toLatin1(limitada + "\n"));
    }

    blocos.push(
      fontNormal,
      toLatin1("--------------------------------\n"),
      new Uint8Array([0x0A, 0x0A]),             // 2 linhas em branco
      new Uint8Array([0x1D, 0x56, 0x42, 0x00])  // cortar papel
    );

    for (const bloco of blocos) {
      await usbDevice.transferOut(usbEndpoint, bloco);
    }
    return true;

  } catch (err) {
    console.error("Erro transmissão USB:", err);
    toast("Erro na transmissão: " + err.message, "erro");
    await desconectarUSB();
    setStatus("Desconectado após erro", "erro");
    return false;
  }
}

async function imprimirFicha(prod, qtd) {
  adicionarItem(prod, qtd);
  document.getElementById(`qtd-${prod.id}`).textContent = "1";
  const sub = prod.preco * qtd;
  const linhas = [
    `${comandaAtiva}`,
    "--- FICHA ---",
    `${prod.nome}`,
    `  x${qtd}  R$ ${sub.toFixed(2)}`,
    `Data: ${new Date().toLocaleString("pt-BR")}`
  ];
  const ok = await enviarESCPOS(linhas);
  if (ok) toast("Ficha impressa!", "sucesso");
}

async function imprimirItens(itens) {
  if (!itens.length) return;
  const linhas = [`${comandaAtiva} — Item`];
  itens.forEach(item => {
    const sub = item.preco * item.qtd;
    linhas.push(`${item.nome}`);
    linhas.push(`  x${item.qtd}  R$ ${sub.toFixed(2)}`);
  });
  linhas.push(`Data: ${new Date().toLocaleString("pt-BR")}`);
  const ok = await enviarESCPOS(linhas);
  if (ok) toast("Item impresso!", "sucesso");
}

async function imprimirCompleto() {
  const c = getCarrinho();
  if (!c.length) { toast("Carrinho vazio", "erro"); return; }

  const linhas = [`${comandaAtiva}`, "--- Itens ---"];
  let total = 0;
  c.forEach(item => {
    const sub = item.preco * item.qtd;
    total += sub;
    linhas.push(`${item.nome}`);
    linhas.push(`  x${item.qtd}  R$ ${sub.toFixed(2)}`);
  });
  linhas.push("---", `TOTAL: R$ ${total.toFixed(2)}`, `Data: ${new Date().toLocaleString("pt-BR")}`);

  const ok = await enviarESCPOS(linhas);
  if (ok) {
    toast("Pedido impresso!", "sucesso");
    if (confirm("Limpar carrinho após impressão?")) {
      comandas[comandaAtiva] = [];
      salvar();
      renderCarrinho();
    }
  }
}

async function testarImpressora() {
  const linhas = [
    "=== TESTE DE IMPRESSAO ===",
    "Conexao USB direta via ESC/POS",
    "123456789012345678901234567890",
    "Fim do teste: " + new Date().toLocaleString("pt-BR")
  ];
  const ok = await enviarESCPOS(linhas);
  if (ok) toast("Teste enviado com sucesso!", "sucesso");
}

// ============================================================
// UTILS
// ============================================================
function esc(str) {
  return String(str).replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
}
